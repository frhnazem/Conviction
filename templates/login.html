{% extends "base.html" %}
{% block title %}Log in — Conviction{% endblock %}
{% block body %}
<p class="kicker">Account</p>
<h1>Log in</h1>
{% include "_nav.html" %}

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="post" class="card">
  <label class="field" for="email">Email</label>
  <input type="email" id="email" name="email" required autocomplete="username">

  <label class="field" for="password" style="margin-top:12px;">Password</label>
  <input type="password" id="password" name="password" required autocomplete="current-password">

  <button class="btn btn-accent" style="margin-top:16px;" type="submit">Log in</button>
</form>

<p class="muted" style="font-size:14px;">No account? <a href="{{ url_for('register') }}">Register</a></p>
{% endblock %}
